description:
  ua: Художник Валентин Українець
  en: Artist Valentin Ukrainetz
  de: Maler Valentin Ukrainetz
body:
  ua: |-
    **Витоки**

    Валентин Українець навчався живопису в Одеському художньому училищі - навчальному закладі, відомому своїми багатими і глибокими художніми традиціями.

    Одеса одне з найоригінальніших міст України, тут змішались мови, народи і культури. Художник, що вступив у контакт з таким багатим світом, отримує додаткові можливості адже для творчих людей ніщо не проходить непоміченим. В. Українець саме така особистість. Одеса допомогла художнику збагнути різні художні світи і створити власну художню мову. Він з вдячністю згадує своїх учителів з середовища одеських художників.

    Однак було б неправильним шукати в творчості Українця специфічні «одеські мотиви». Можливо, головний урок Одеси для художника внутрішня свобода.

    **Декадентство**

    Творчість Українця певною мірою типова для кінця сторіччя. Так вже склалось, що на межі століть наростають декадентські настрої в суспільному житті і в мистецтві. Старі, ще радянські словники визначають декадентство як «кризове явище, що характеризується настроями безнадійності, неприйняття життя, індивідуалізму».

    Навряд чи такі означення об'єктивно виражають сутність цього явища, сильною стороною якого є витончений естетизм, бунт проти «здорового», «нормального», тобто нерідко міщанського, примітивного світосприйняття і проти мистецтва такого штибу.

    Пошуки В. Українця першу чергу пошуки естета. Якщо ж користуватись в принципі досить відносними «-ізмами», то можна сказати про помітні сюрреалістичні, романтичні, постмодерністські впливи. Втім, особистий культурний багаж художника включає різноманітні, часто взаємовиключаючі світи; Маркеса і Хемінгуея, Борхеса і Далі, Брейгеля Мужицького і Босха.

    Художник пише багато, наполегливо, натхненно, розширюючи і поглиблюючи, розкриваючи свої безкінечні фантазії про світ, знаходячи кожного разу оригінальніші й цікавіші символи і образи для того, щоб матеріалізувати тонку грань, що знаходиться в проміжку між власним внутрішнім і зовнішнім світами в світі перетвореному. Його картини народжуються в снах, медитаціях, іноді він імпровізує в дусі джазового музиканта.

    Митець прагне торкнутися ірреального, позачасового, того, що знаходиться на межі сну і дійсності, мистецтва і життя, життя і театру. Виразно позначене карнавальне, лялькове начало. Певною мірою це втеча від життя в світ уяви, таємниці, гри. Художник створює полотна - міфи, населені екзотичними птахами, тваринами, людьми. Перед нами оживають вигадані міста, країни, світи.

    Дивні міста з химерною архітектурою, в якій змішались різноманітні стилі, дуже багато символіки, що стала архетипною в мистецтві годинники, риби, драбини, птахи. Відчувається ілюзорність, навіть деяка іграшковість змальованого.

    Здається, що найменший порив легкого вітру здатний знести все це в небуття. Гармонія камерної теплоти і космічного холоду виникає на наших очах з тонких світів сновидінь, позамежжя. Але справжньої драми немає. Це скоріше гра в драму, трагедію. Витончена сюрреалістична гра, в якій немає почуття безвиході. Ці фантазії захоплюють і лякають, вони прекрасні і небезпечні одночасно. Світ Валентина Українця це світ мрій про прекрасне і усвідомлення нездійсненності цих мрій.

    **Стиль**

    Художник часто використовує традиційний постмодерністський прийом цитування. Для цього він послуговується образами-символами старих і нових художників, вводячи цитати в свій; контекст, завдяки чому вони отримують новий зміст, смисл, точніше анти-смисл.

    ![](/media/news/Pic-1.jpg)

    Композиція картин часто горизонтальна. Сюжети розгортаються на великих площинах з далеким обрієм під високим небом. Глядача начебто втягує в картину перспектива, що простягається вдалечінь. Це надає сюжетам значимості і «космічності». Персонажі картин належать не конкретному часу вони скоріше позачасові. Вони живуть в холодному просторі і застиглому часі. Художник подає своїх героїв в камерному світі, але в контексті великого простору. Іноді він навіть вирішує образ начебто поза тим простором, в котрому цей образ знаходиться. Це посилює ефект відчуження людини від світу, умовність реальності.

    Художник поєднує чисто реалістичні прийоми з чисто декоративними, умовними: іноді він ліпить плоть рельєфно і виразно, скульптурно, а часто, навпаки, позбавляє своїх героїв матеріальності, доводячи іноді вирішення образу до максимальної прозорості, майже позбавленої будь-якого натяку на плоть.

    Для митця характерні різні підходи в передачі кольору: локальний, напружений колір і м'які тональні переходи з приглушеними контурами. Він любить контрасти в кольорі, в кольорових співвідношеннях. Типові для художника поєднання рельєфного пастозного мазка і майже графічних елементів.

    ![](/media/news/Pic-2.jpg)

    Валентин Українець безумовно, обдарована особистість. Це дає надію, що ні прагматичний дух нашого часу, ні специфічні проблеми, які породжує провінція в Україні зараз, не завадять йому досягти вершин мистецтва, і прекрасний світ українського світового живопису збагатиться ще одним українським іменем.

    ***Ірина Вишневецька***

    ***мистецтвознавець***
  en: |-
    **Origins**

    Valentin Ukrainetz mastered his painting skills in the Odessa College of Arts, the school which is prominent for its generous traditions in fine arts.

    Odessa is one of the most picturesque cities in Ukraine, being an unique mix of languages, nations and cultures. Any painter/artist who have contacted/touched such a generous Universe, will inevitably enrich his talent, because any creative person is always affected by every intrinsic feature in the environment. Valentin Ukrainetz is definitely such a person. Odessa helped the painter to comprehend various imaginative worlds and create his own artistic language. Valentin always speaks with great appreciation about his teachers – painters of Odessa environment.

    However, any attempts to find specific ‘Odessa motifs’ in the oeuvre of Ukrainetz may be incorrect. Probably, internal freedom is the main lesson of Odessa for the artist.

    **Decadence**

    In many aspects, oeuvre of Ukrainetz has characteristic signs of the end of the century. Historically, at the turn of the century decadent mood is increasing both in the social life and in fine art. Some dictionaries define decadence as ‘Crisis phenomenon’, which can be characterized by feeling of desperation, antagonism against life, and acute individualism’. Such definition is doubtfully correct in full, as this phenomenon has such strong points as sophisticated aestheticism, and rebellion against ‘healthy’, or ‘normal’, in other words, primitive and bourgeois mentality, as well as against ‘art’ of such type.

    Creative endeavor of Valentin Ukrainetz is, first of all, pursuit of the aesthete. In more specific words, influences of Surrealism, Romanism and Post-modern are quite remarkable. However, personal cultural equipment of Valentin accommodates different, sometimes mutually exclusive, worlds: Marques and Hemingway, Borges and Dali, Brueghel the Elder and Bosch.

    Valentin limns much, insistently and passionately, extending and enriching his own fantasies about universe, and always finding more original and interesting symbols and imageries. Such gestalts help to outline that delicate edge separating internal and external worlds in the university of transformed images. Paintings of Valentin are born in dreams and meditations; sometime he rides like jazz musician.

    The artist strives to touch unreal and out-of-time sphere, which exists at the brink between dream and reality; art and life; life and theatre. Carnival and ‘toy-house’ motifs are obviously evident. In a certain way, this is escape from real life into the world of fancy, mystery and game. Valentin creates canvas which themselves are myths and populated with exotic birds, animals and humans. In front of our eyes imaginary towns, countries and worlds are awakening. Miraculous cities with chimerical architecture, comprising different styles; there are lots of symbols which became archetypical in the art: clocks, fishes, ladders, birds. The paintings create feeling of illusiveness and even ‘toy’ world.

    Seems like that most gentle blow of wind is able to get this into a non-existence. Harmony of intimate warm and cosmic cold is created in front of our eyes from the delicate worlds of dreams and existentiality. However, there is no real drama. This is rather a pretending of drama and tragedy. Sophisticated surrealistic play, which does not create sense of frustration. These fantasies are grasping and fearing you, they are wonderful and dangerous in the same time. World of Valentin Ukrainetz is the world of dreams about beauty, and understanding the infeasibility of these dreams.

    **Style**

    The artist often uses traditional post-modern technique of referencing. He exploits patterns and symbols of other well-known and young artists, introducing these references into his own context; consequently they acquire new content and sense, or, to be more exact, anti-sense.

    ![](/media/news/Pic-1.jpg)

    Composition of his paintings is usually horizontal. Their themes often spread over large areas with remote horizon under high heaven. The viewer is drawn into the painting by the perspective which is stretching into the distance. This confers significance and ‘cosmicality’ to the narrative.

    Characters of the paintings do not belong to any specific time; they are rather out-of-time. They live in cold space/universe and frozen time. Valentin presents his characters in chamber world, however in the context of great area. Sometimes he places the character out of the space where it should be located. This increases the effect of self-alienation of the human from the world, as well as conventional nature of the reality.

    Valentin combines pure realistic methods with pure decorative ones: sometimes he shapes the body in relief and expressively, like a sculpture; in contrast, in other cases, he deprives his characters from substantiality, sometimes making them maximally transparent, almost keeping them out of any signs of the flesh.

    Valentin uses various techniques for color expression: local vibrant colors along with soft tonal gradients with unclear contours. He loves contrast in color and in color tone balance. Combinations of relief brushstrokes and elements of graphic arts are typical for the painter.

    ![](/media/news/Pic-2.jpg)

    Valentin Ukrainetz is obviously endowed person. So we hope that neither excessively pragmatic soul of nowadays, nor the problems, which are present in Ukraine, will not prevent him from reaching the pinnacle of painting and gorgeous world of modern arts will be enriched with yet another Ukrainian name.

    **Iryna Vyshnevetska**

    **Fine art expert**
  de: |-
    **Quellen**

    Valentyn Ukrainets studierte Malerei in Odesa an der künstlerischen Schule - an der Bildungseinrichtung, die für ihre reichen und tiefen künstlerischen Traditionen bekannt ist. Odesa ist eine der originellsten Stadt der Ukraine, hier mischten sich die Sprachen, Völker und Kulturen. Der Maler, der mit solcher reichen Welt kontaktiert, bekommt zusätzliche Möglichkeiten, weil für die schöpferischen Menschen nichts unbeachtet vergeht. V. Ukrainets ist eine solche Person. Odesa half dem Maler, verschiedene künstlerische Welten zu verstehen und eigene künstlerische Sprache zu schaffen. Er erinnert sich an seine Lehrer aus der Umkreisung der odesischen Maler.

    Aber, es wäre unrichtig, im Schaffen des Ukrainers spezifische “odesischen Motiven” zu suchen Vielleicht, der wichtige odesische Lehre für den Maler ist innere Freiheit.

    **Dekadenz**

    Das Schaffen des Ukrainers ist, in gewissem Maße, typisch für das Ende eines Jahrhunderts. Es passierte, dass an der Jahrhundertwende dekadente Stimmung im öffentlichen Leben und in der Kunst wächst. Die alten, noch sowjetischen Wörterbücher definieren Dekadenz als “die Krise, die mit der Stimmung der Hoffnungslosigkeit, Ablehnung des Lebens, Individualismus gekennzeichnet wird”. Kaum solche Bestimmungen drücken das Wesen dieser Erscheinung aus, deren gewaltige Seite feiner Ästhetizismus, Rebellion gegen „gesundes“, „normales“, d.h. kleinbürgerliches, primitives Weltbild und gegen solche Kunst ist.

    Das Aufsuchen von V. Ukrainets ist vor allem das Aufsuchen von Ästhet. Wenn man in Prinzip relative “-ismus” braucht, so kann man über bemerkbarere, surrealistische, romantische, postmoderne Einflüsse sagen. Aber, eigener kulturelle Hintergrund des Malers hat verschiedene, oft antinomische Welten; Merkes und Hyeminhuey, Borges und Dali, Bruegel und Myschitskij, Bosch.

    Der Maler schreibt viel, hartnäckig, stimmungsvoll, erweiternd und vertiefend, seine endlose Fantasien über den Welt öffnend, jedes Mal die originellsten und interessantesten Symbole und gestalte findend, um schmalen Grat, der sich im Zwischenraum zwischen Innenleben und Außenwelt im ausgebauten Welt befindet, zu materialisieren. Seine Bilder sind in Träumen und Nachsinnen geboren, manchmal improvisiert er als ein Jazz-Musikant.

    Der Maler will etwas Irreales, Zeitloses, das, was sich an der Grenze des Traums und der Wirklichkeit, der Kunst und des Lebens, des Lebens und des Theaters befindet, berühren. Der karnevaleske, puppenhafte Anfang ist aussagekräftig. In gewissem Maße, das ist eine Flucht vom Leben in den Welt der Phantasie, der Heimlichkeit, des Spieles. Der Maler schafft die Bilder-Mythos, wo es exotische Vögel, Tiere und Menschen gibt. Vor uns leben ausgedachte Städte, Länder, Welten auf.

    Wunderbare Städte mit schimärischer Architektur, wo sich verschiedene Bauabnahmen mischten, es gibt sehr viel Symbolik, die in der Kunst archimedisch wurde: Uhren, Fische, Treppen, Vögel. Man fühlt die Traumhaftigkeit der Bilder.

    Es scheint, dass der kleinste Windstoß das alles zerstören kann. Die Harmonie der Wärmekammer und der kosmischen aus schmalen Welten der Träume. Aber es gibt kein echtes Drama. Das ist am ehesten ein Spiel ins Drama, in der Tragödie. Das ist das verfeinerte surrealistische Spiel, wo es kein Gefühl der Ausweglosigkeit gibt. Die Fantasien beherrschen und schrecken, gleichzeitig sind sie wunderbar und gefährlich. Der Welt von Valentyn Ukrainets ist ein Welt der Träume über Schöne und ein Bewusstsein der Unmöglichkeit dieser Träume.

    **Ausdruckweise**

    Der Maler benutzt traditionelle postmodernische Methode der Zitierung. Dafür gebraucht er die gestalte-Symbole der alten und neuen Maler, angeführte Worte in seinem Kontext benutzend, wodurch bekommen sie einen neuen Gehalt, eine neue Bedeutung, genau gesagt anti-Bedeutung.

    ![](/media/news/Pic-1.jpg)

    Die Architektonik der Bilder ist oft horizontal. Die Handlungen kommen auf großen Flächen mit weitem Horizont unter dem hohen Himmel vor. Den Zuschauer zieht als ob ins Bild ein Ausblick, der hinaus verlängert, hinein. Das gibt den Handlungen die Notabilität und “kosmische” Bedeutung. Die Bildgestalte gehören nicht der konkreten Zeit, sie sind am ehesten zeitlos. Sie leben im kalten Raum und in der starren Zeit. Der Maler zeigt seine Figuren in der Weltkammer, aber im Kontext eines großen Raums. Manchmal zeigt er die Gestalt als ob außerhalb jenem Raum, wo sich diese Gestalt befindet. Das verstärkt ein Verfremdungseffekt eines Menschen vom Welt, die Relalivität der Wirklichkeit.

    Der Maler verbindet realistische Methode mit dekorativem, eventualem: manchmal bosseliert er die Erdenhülle körperhaft und aussagekräftig, bildnerisch, und oft, im Gegenteil befreit er seine Figuren eine Körperlichkeit und bringt eine Gestalt zur maximalen Durchsichtigkeit, die fast keine Andeutung an Erdenhülle hat.

    Für den Maler sind verschiedene Annäherungen zur Farbenwiedergabe charakteristisch: Lokalkolorit , intensive Farbe und weiche tonale Übergänge mit gedeckten Konturen. Er mag Kontraste in der Farbe, in den farbigen Proportionen. Für den Maler sind Verbindungen eines körperhaften pastösen Striches und fast grafischer Elementen typisch.

    ![](/media/news/Pic-2.jpg)

    Valentyn Ukrainets ist absolut eine begabte Person. Das gibt eine Hoffnung, dass weder pragmatische Atmosphäre unserer Zeit, noch spezifische Probleme, die eine Provinz jetzt in der Ukraine hervorbringt, stören ihn nicht, die Höhe der Kunst zu leisten und ein wunderbarer Welt der ukrainischen Weltmalerei wird mit noch einem ukrainischen Namen reich.

    **Iryna Vyschnevetska**

    **Kunsthistorikerin**
