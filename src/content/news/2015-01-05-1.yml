body:
  ua: |-
    Новий, 2015 розпочався з завершення ... Завершення написання картини «Плоди». Фентезійний сюжет, і, якщо хочете, сюрреалістичний у світлому в сенсі цього визначення. Тут ви поринете в події світу неземного, але не дуже віддаленого від нього. Плоди в сенсі символ матеріального достатку, чому б і не мати місце цього? Природно, духовне зростання визначає фізичне перебування людини в тому чи іншому місці. І, цей світ для натур піднесених і світлих. Ласкаво просимо ...

    ![](/media/news/Plodi-s.jpg)
  en: |-
    The new, 2015 began with the completion ... completion of the painting "Fruits". Fantasy story, and if you like, in a surreal light in the sense of this definition. Here you will plunge into the world of unearthly events, but not very distant from him. The fruit in the sense of the character of material abundance, why does not this take place? Naturally, spiritual growth determines the physical presence of man in this or that place. And this world of light and sublime natures. Welcome ...

    ![](/media/news/Plodi-s.jpg)
  de: |-
    Die neue, begann 2015 mit der Fertigstellung ... Fertigstellung der Malerei "Fruits". Fantasy-Geschichte, und wenn Sie möchten, in einer surrealen Licht im Sinne dieser Definition. Hier werden Sie in die Welt der überirdische Ereignisse stürzen, aber nicht sehr weit entfernt von ihm. Die Frucht im Sinne des Zeichenmaterialfluss , warum dies nicht statt? Natürlich bestimmt spirituelles Wachstum die physische Präsenz des Menschen in diesem oder jenem Ort. Und diese Welt von Licht und erhabenen Naturen.

    ![](/media/news/Plodi-s.jpg)
